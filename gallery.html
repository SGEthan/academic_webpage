<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Gallery | Yichuan Deng</title>
    <meta
      name="description"
      content="Photo gallery of Yichuan Deng."
    />
    <link rel="icon" type="image/svg+xml" href="assets/education/uw-logo.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css?v=6358b7f6f731" />
  </head>
  <body>
    <header class="site-header">
      <div class="container nav-wrap">
        <a class="logo" href="index.html">Yichuan Deng</a>
        <div class="nav-actions">
          <nav aria-label="Main navigation">
            <a href="index.html#about">About</a>
            <a href="index.html#publications">Publications</a>
            <a href="index.html#gallery">Gallery</a>
          </nav>
          <button class="theme-toggle" id="theme-toggle" type="button" aria-label="Toggle color theme">
            Auto
          </button>
        </div>
      </div>
    </header>

    <main>
      <section class="section container gallery-page-section">
        <div class="section-title">
          <h2>Full Gallery</h2>
          <p>A full collection of photos. Click any image to preview.</p>
          <a class="view-all-btn" href="index.html#gallery">← Back to Homepage Gallery</a>
        </div>
        <div class="gallery-views">
          <div class="gallery-view-tabs" role="tablist" aria-label="Gallery view">
            <button class="gallery-view-tab" id="gallery-grid-tab" type="button" role="tab" aria-selected="true" aria-controls="gallery-grid-panel">Gallery</button>
            <button class="gallery-view-tab" id="gallery-globe-tab" type="button" role="tab" aria-selected="false" aria-controls="gallery-globe-panel" tabindex="-1" disabled>Globe</button>
          </div>
          <div id="gallery-grid-panel" role="tabpanel" aria-labelledby="gallery-grid-tab">
            <div class="gallery-page-grid" data-gallery-page>
              <figure class="gallery-card gallery-loading">
                <figcaption>Loading gallery...</figcaption>
              </figure>
            </div>
          </div>
          <div class="gallery-globe-panel" id="gallery-globe-panel" role="tabpanel" aria-labelledby="gallery-globe-tab" hidden>
            <div class="gallery-globe-layout">
              <div class="gallery-globe-world">
                <div class="gallery-globe-stage" id="gallery-globe-stage">
                  <div class="gallery-globe-map" id="gallery-globe-map" role="region" aria-label="Photo locations on a zoomable globe" aria-describedby="gallery-globe-hint"></div>
                  <div class="gallery-globe-navigation" role="group" aria-label="Globe navigation">
                    <button id="gallery-globe-zoom-in" type="button" aria-label="Zoom in" disabled>+</button>
                    <button id="gallery-globe-zoom-out" type="button" aria-label="Zoom out" disabled>−</button>
                  </div>
                </div>
                <div class="gallery-globe-controls">
                  <p id="gallery-globe-hint">Click a photo to expand · Drag to explore · + / − to zoom</p>
                  <button class="gallery-globe-action" id="gallery-globe-reset" type="button" disabled>Overview</button>
                  <button class="gallery-globe-action" id="gallery-globe-rotate" type="button" aria-pressed="true" disabled>Pause rotation</button>
                </div>
                <p class="gallery-globe-message" id="gallery-globe-message" role="status" hidden></p>
                <button class="gallery-globe-action" id="gallery-globe-retry" type="button" hidden>Retry globe</button>
              </div>
            </div>
          </div>
        </div>
      </section>
    </main>

    <div class="lightbox" id="lightbox" aria-hidden="true">
      <div class="lightbox-backdrop" data-close="true"></div>
      <div class="lightbox-content" role="dialog" aria-modal="true" aria-label="Gallery image viewer">
        <button class="lightbox-close" id="lightbox-close" type="button" aria-label="Close image viewer">×</button>
        <button class="lightbox-nav lightbox-prev" id="lightbox-prev" type="button" aria-label="Previous image">‹</button>
        <img id="lightbox-image" src="" alt="" />
        <button class="lightbox-nav lightbox-next" id="lightbox-next" type="button" aria-label="Next image">›</button>
        <p id="lightbox-caption" aria-live="polite" aria-atomic="true" hidden></p>
      </div>
    </div>

    <footer class="site-footer">
      <div class="container footer-wrap">
        <p>© 2026 Yichuan Deng • University of Washington</p>
        <a href="index.html#top">Back to home</a>
      </div>
    </footer>
    <script src="script.js?v=c57d42506e9a"></script>
  </body>
</html>
